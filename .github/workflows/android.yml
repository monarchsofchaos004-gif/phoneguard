name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 已內建 Android SDK（ANDROID_HOME）；只需接受授權，缺的元件 AGP 會自動補下
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      # CI only builds a debug APK as a build check; releases only carry the APK signed with the developer's release key, uploaded separately.
      - name: Build debug APK
        working-directory: app-android
        run: gradle --no-daemon --console=plain assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: phoneguard-debug-apk
          path: app-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build release APK (unsigned; signed later on the developer's machine)
        working-directory: app-android
        run: gradle --no-daemon --console=plain assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: phoneguard-release-unsigned
          path: app-android/app/build/outputs/apk/release/app-release-unsigned.apk
